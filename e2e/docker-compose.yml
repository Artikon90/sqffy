# Linux e2e stack: Postgres + MySQL + MariaDB + ClickHouse + Rust runner.
#
#   docker compose -f e2e/docker-compose.yml up --build --abort-on-container-exit
#
# Oracle is optional (heavy image + Instant Client); set SQFFY_E2E_ORACLE manually.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sqffy
      POSTGRES_PASSWORD: sqffy
      POSTGRES_DB: sqffy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sqffy -d sqffy"]
      interval: 2s
      timeout: 5s
      retries: 30

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: sqffy
      MYSQL_DATABASE: sqffy
      MYSQL_USER: sqffy
      MYSQL_PASSWORD: sqffy
    command: ["--default-authentication-plugin=caching_sha2_password"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-usqffy", "-psqffy"]
      interval: 3s
      timeout: 5s
      retries: 40

  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: sqffy
      MARIADB_DATABASE: sqffy
      MARIADB_USER: sqffy
      MARIADB_PASSWORD: sqffy
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 5s
      retries: 40

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    environment:
      CLICKHOUSE_USER: sqffy
      CLICKHOUSE_PASSWORD: sqffy
      CLICKHOUSE_DB: sqffy
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- 'http://127.0.0.1:8123/ping' | grep -q Ok"]
      interval: 3s
      timeout: 5s
      retries: 40

  e2e:
    build:
      context: ..
      dockerfile: e2e/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      mysql:
        condition: service_healthy
      mariadb:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    environment:
      CARGO_TERM_COLOR: never
      NO_COLOR: "1"
      SQFFY_E2E_POSTGRES: postgres://sqffy:sqffy@postgres:5432/sqffy
      SQFFY_E2E_MYSQL: mysql://sqffy:sqffy@mysql:3306/sqffy
      SQFFY_E2E_MARIADB: mariadb://sqffy:sqffy@mariadb:3306/sqffy
      SQFFY_E2E_CLICKHOUSE: clickhouse://sqffy:sqffy@clickhouse:8123/sqffy
    volumes:
      - ..:/app
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
      - cargo-target:/app/target
    working_dir: /app
    command: ["bash", "e2e/run.sh"]

volumes:
  cargo-registry:
  cargo-git:
  cargo-target:
