[alias]
# End-to-end CLI tests. Not run by default `cargo test`.
#   cargo e2e       — always-on (sqlite / cli / mcp + scheme checks)
#   cargo e2e-all   — + server adapters when SQFFY_E2E_* is set
e2e = "test --features e2e --test e2e_cli --test e2e_sqlite --test e2e_mcp --test e2e_postgres --test e2e_mysql --test e2e_mariadb --test e2e_clickhouse --test e2e_oracle"
e2e-all = "test --features e2e --test e2e_cli --test e2e_sqlite --test e2e_mcp --test e2e_postgres --test e2e_mysql --test e2e_mariadb --test e2e_clickhouse --test e2e_oracle -- --include-ignored --nocapture"
