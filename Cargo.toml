[package]
name = "sqffy"
version = "0.1.0"
edition = "2024"
description = "SQffy вЂ” fast SQL CLI with saved connections (sqf)"
license = "MIT"
readme = "README.md"
keywords = ["sql", "sqlite", "cli", "repl"]
categories = ["command-line-utilities", "database"]

[[bin]]
name = "sqf"
path = "src/main.rs"

[features]
default = ["sqlite", "postgres", "mysql", "mariadb"]
sqlite = ["dep:rusqlite"]
postgres = ["dep:postgres"]
mysql = ["dep:mysql"]
mariadb = ["dep:mysql"]
## Enable with `cargo e2e` вЂ” not part of default `cargo test`.
e2e = []

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
rustyline = "15"
owo-colors = "4"
comfy-table = { version = "7", features = ["custom_styling"] }
rusqlite = { version = "0.32", features = ["bundled", "column_decltype"], optional = true }
postgres = { version = "0.19", optional = true }
mysql = { version = "25", optional = true, default-features = true }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
directories = "6"
unicode-width = "0.2"
crossterm = "0.28"
fake = { version = "3", features = ["derive"] }
rand = "0.8"
tiny_http = "0.12"

[dev-dependencies]
criterion = "0.5"
serde_json = "1"
tempfile = "3"

[[test]]
name = "e2e_cli"
path = "tests/e2e_cli.rs"
required-features = ["e2e"]

[[test]]
name = "e2e_sqlite"
path = "tests/e2e_sqlite.rs"
required-features = ["e2e"]

[[test]]
name = "e2e_mcp"
path = "tests/e2e_mcp.rs"
required-features = ["e2e"]

[[test]]
name = "e2e_postgres"
path = "tests/e2e_postgres.rs"
required-features = ["e2e"]

[[test]]
name = "e2e_mysql"
path = "tests/e2e_mysql.rs"
required-features = ["e2e"]

[[bench]]
name = "render_table"
harness = false

[[bench]]
name = "complete"
harness = false

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

